<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ケースのわずかな厚み（立体感） -->
  <rect x="6" y="7" width="52" height="52" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2.2" />
  <!-- ジャケットケース正面（水平・まっすぐ） -->
  <rect x="5" y="4" width="52" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2.4" />

  <!-- レコード盤（ブルーグレー） -->
  <circle cx="29" cy="31" r="17.5" fill="#94a3b8" />
  <circle cx="29" cy="31" r="12.5" stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.55" />
  <!-- 中心の白い穴 -->
  <circle cx="29" cy="31" r="5.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- 右上のトーンアーム（レコード針） -->
  <rect x="44" y="11" width="6.5" height="6.5" rx="1.5" fill="#7c8ea6" />
  <path d="M 47.2 17.5 L 47.2 30.5 L 40.5 37.5" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 41.5 36.5 L 38.5 39.5" stroke="#475569" stroke-width="3.6" stroke-linecap="round" />
</svg>
